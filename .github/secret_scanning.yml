# The prefilter is tested against strings that look exactly like leaked credentials, because that
# is the thing it exists to catch. Those fixtures are invented and match nothing real, so secret
# scanning should not raise an alert on them.
#
# This excludes them from alerts only. Push protection does not read this file, so an edit that
# touches one of these lines may still be blocked at push time and need an explicit bypass.
paths-ignore:
  - "python/tests/test_integration.py"
  - "ts/test/integration.test.ts"
  - "python/src/guardrail_chatbot_jev/prefilter.py"
  - "ts/src/prefilter.ts"
